<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="settingsTitle">KGesture · Settings</title><link rel="stylesheet" href="options.css"></head>
<body>
  <main>
    <header><h1 data-i18n="settingsHeading">Gesture settings</h1><label class="enable"><span data-i18n="enabled">Enabled</span><input id="enabled" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label></header>
    <form id="settings-form">
      <section id="gestures"><div class="section-heading"><h2><span data-i18n="gestures">Gestures</span> <span id="binding-count" class="count"></span></h2><button id="add-binding" type="button" class="secondary" disabled><span aria-hidden="true">＋ </span><span data-i18n="recordGesture">Record gesture</span></button></div><div class="table-wrap"><table><thead><tr><th data-i18n="gestures">Gestures</th><th data-i18n="action">Action</th><th><span class="sr-only" data-i18n="controls">Controls</span></th></tr></thead><tbody id="bindings"></tbody></table></div></section>
      <section id="experience"><div class="section-heading"><h2 data-i18n="appearance">Appearance &amp; recognition</h2></div><div class="settings-card"><label class="setting-row"><strong data-i18n="trail">Trail</strong><input id="showTrail" type="checkbox" role="switch"></label><label class="setting-row"><strong data-i18n="actionHint">Action hint</strong><input id="showHint" type="checkbox" role="switch"></label><label class="setting-row"><strong data-i18n="threshold">Recognition distance</strong><span class="range-wrap"><input id="threshold" type="range" min="4" max="64" step="1"><output id="threshold-value"></output></span></label><div class="setting-row"><strong data-i18n="trailStyle">Trail style</strong><div class="style-controls"><label><span class="sr-only" data-i18n="trailColor">Trail color</span><input id="trailColor" type="color"></label><label><span class="sr-only" data-i18n="trailWidth">Trail width</span><input id="trailWidth" type="number" min="1" max="12" step="1"> px</label></div></div></div></section>
      <section id="sites"><div class="section-heading"><h2 data-i18n="excludedSites">Excluded sites</h2></div><label for="excludedHosts" class="sr-only" data-i18n="excludedSitesLabel">Excluded domains, one per line</label><textarea id="excludedHosts" rows="3" placeholder="example.com&#10;*.example.org" spellcheck="false"></textarea><p class="help" data-i18n="excludedSitesHelp">One domain per line. Wildcards such as *.example.org are supported.</p></section>
      <section id="data"><div class="section-heading"><h2 data-i18n="configuration">Configuration</h2></div><div class="data-actions"><button id="export" type="button" class="secondary"><span aria-hidden="true">↓ </span><span data-i18n="exportSettings">Export</span></button><label class="secondary import-label"><span aria-hidden="true">↑ </span><span data-i18n="importSettings">Import</span><input id="import" type="file" accept="application/json,.json" class="sr-only"></label><button id="reset" type="button" class="text-button" data-i18n="resetDefaults">Reset defaults</button></div></section>
      <footer><span id="status" role="status" aria-live="polite"></span><button id="save" type="submit" class="primary" data-i18n="save">Save</button></footer>
    </form>
  </main>
  <dialog id="recorder" aria-labelledby="recorder-title" aria-describedby="recorder-help">
    <div class="recorder-heading"><h2 id="recorder-title" data-i18n="recordGesture">Record gesture</h2><button id="record-cancel" type="button" class="remove" aria-label="Close recorder" data-i18n-aria-label="closeRecording">×</button></div>
    <p id="recorder-help" data-i18n="recordingHelp">Hold a mouse button and draw below.</p>
    <canvas id="record-canvas" width="560" height="260" aria-label="Gesture recording area" data-i18n-aria-label="recordingArea"></canvas>
    <div class="record-feedback"><output id="record-pattern" aria-label="Recorded directions" data-i18n-aria-label="recordedDirections"></output><span id="record-status" role="status" aria-live="polite"></span></div>
    <div class="recorder-actions"><button id="record-reset" type="button" class="secondary" data-i18n="rerecord">Record again</button><button id="record-use" type="button" class="primary" disabled data-i18n="useGesture">Use gesture</button></div>
  </dialog>
  <script type="module" src="options.js"></script>
</body></html>
